name: "Bug Report"
description: "Submit an issue related to one of my modpacks."
labels: ["Bug Report"]
assignees: ["MagmaCube_123"]
body:
  - type: dropdown
    id: select_modpack
    attributes:
      label: "Select Modpack"
      description: "Select the modpack you're submitting an issue for."
      options:
        - "Aetheric Journeys"
        - "BetweenCraft"
        - "LOTR: The Forgotten Age (Currently being reworked)"
        - "Realism & Magic"
    validations:
      required: true
  - type: checkboxes
    id: pre_report_checklist
    attributes:
      label: "Pre-Report Checklist"
      description: "Please read and agree to the following:"
      options:
        - label: "If I use OptiFine or a modified version of this modpack, ithis issue is NOT valid."
        - label: "I have tried reporting this bug to the mod developer(s) first."
        - label: "I'm using the latest version of this modpack."
        - label: "I have read the Known Issues list and FAQ."
    validations:
      required: true
  - type: input
    id: describe_the_bug
    attributes:
      label: "Describe the Bug"
      placeholder: "..."
    validations:
      required: true
  - type: input
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      placeholder: "Place this block, use that item, kill those mobs..."
    validations:
      required: true
  - type: textarea
    id: screenshots_or_videos
    attributes:
      label: "Screenshots or Videos"
      placeholder: "..."
    validations:
      required: true
  - type: textarea
    id: crash_reports_and_or_logs
    attributes:
      label: "Crash Reports and/or Logs"
      placeholder: "..."
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Anything else to add?"
      placeholder: "..."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **By opening this report, you agree with everything that you've checked off and filled everything with the required info. If you're a troll who opened this just to get attention for no reason, then this issue will be deleted and you will be blocked from this repository without warning.**